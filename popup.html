<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expo Smooth Scroll</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="curve-badge" title="easeOutExpo(t) = 1 - 2^(-10t)">
          <svg viewBox="0 0 36 24" width="28" height="18" fill="none">
            <path d="M2 22 C 5 4, 14 2.5, 34 2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1>Expo Smooth Scroll</h1>
          <span class="subtitle">easeOutExpo(t) = 1 - 2<sup>-10t</sup></span>
        </div>
      </div>
      <label class="switch" title="Enable globally">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="card site-card" id="siteCard">
      <div class="site-info">
        <span class="site-label">Current site</span>
        <span class="site-domain" id="siteDomain">—</span>
      </div>
      <button class="site-btn" id="siteToggleBtn" type="button">Enabled</button>
    </div>

    <div class="card controls" id="controlsCard">
      <div class="control-group">
        <div class="control-header">
          <label for="durationRange">Expo Out Duration</label>
          <span class="value-pill" id="durationValue">750 ms</span>
        </div>
        <input type="range" id="durationRange" min="200" max="1500" step="25" value="750" />
        <div class="range-labels">
          <span>Snappy (200ms)</span>
          <span>Silky (1500ms)</span>
        </div>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label for="stepRange">Scroll Step Scale</label>
          <span class="value-pill" id="stepValue">1.0x</span>
        </div>
        <input type="range" id="stepRange" min="0.5" max="2.5" step="0.1" value="1.0" />
        <div class="range-labels">
          <span>0.5x</span>
          <span>2.5x</span>
        </div>
      </div>

      <div class="control-row">
        <div>
          <div class="row-title">Keyboard Smooth Scroll</div>
          <div class="row-desc">Arrows, Space, PageUp / PageDown</div>
        </div>
        <label class="switch small">
          <input type="checkbox" id="keyboardToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <footer class="footer">
      <button class="reset-btn" id="resetBtn" type="button">Reset Defaults</button>
      <span class="status-text" id="statusText">Saved</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
